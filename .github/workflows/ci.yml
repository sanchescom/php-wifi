name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        collections: ['11.*', '12.*', '13.*']
        exclude:
          # illuminate/collections 13 requires PHP ^8.3
          - php: '8.2'
            collections: '13.*'
    name: PHP ${{ matrix.php }} / collections ${{ matrix.collections }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --no-interaction --no-update "illuminate/collections:${{ matrix.collections }}"
      - run: composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer lint
      - run: composer analyse
      - run: composer test

  lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: PHP 8.2 / lowest dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer lint
      - run: composer analyse
      - run: composer test
